name: Feature request
description: Suggest an improvement or a roadmap item
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Sketch of the design, and how it could be tested.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
