name: Bug report
description: Something builds, runs or computes incorrectly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands, starting from a clean checkout.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Full output / logs
      render: text
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - download / cleaning / dedup
        - tokenizer
        - model / numerics
        - training loop / optimiser
        - evaluation
        - GGUF export / tinyinfer parity
        - docs
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Python + PyTorch version, CPU/GPU, command used"
    validations:
      required: true
